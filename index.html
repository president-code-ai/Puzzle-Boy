<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#182c2a">
  <meta name="description" content="回転する扉と石を動かして、みんなを出口へ。スマートフォンで遊べる全30面のパズル。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>パズル</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23182c2a'/%3E%3Cpath d='M32 12v40M12 32h40' stroke='%23e9b861' stroke-width='12' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2378c8b1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="levels.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="render.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="stages" class="stage-picker" aria-label="ステージを選ぶ">
        <span class="stage-label">LEVEL <span id="level-number">01</span><span class="divider">/</span>FLOOR</span>
        <strong><span id="floor-number">01</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></strong>
      </button>
      <div class="top-actions">
        <button id="sound" class="icon-button" aria-label="効果音をオフにする" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><span id="sound-label">ON</span></button>
        <button id="help" class="icon-button" aria-label="遊び方"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.6 2.6 0 1 1 4 2.3c-1 .6-1.5 1.2-1.5 2.7M12 17h.01"/></svg></button>
      </div>
    </header>
    <section class="play-area" aria-label="ゲーム">
      <div class="board-shell">
        <div class="board-topline"><span class="mission"><i></i><span id="mission">出口の階段をめざそう</span></span><button id="zoom" class="zoom-button" aria-label="盤面を拡大する" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6M10 7v6"/></svg></button></div>
        <canvas id="board" tabindex="0" role="img" aria-label="パズル盤面。方向キーで移動、Zで1手戻す、Cで仲間を切り替え。"></canvas>
        <div class="board-bottomline"><span id="difficulty">やさしい</span><span class="completion"><span id="completed">0</span><span class="muted"> / 30 CLEAR</span></span></div>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </div>
      <div class="console">
        <div class="stats"><div><span class="eyebrow">STEPS</span><strong id="moves">0</strong><span class="stat-unit">歩</span></div><div><span class="eyebrow">TIME</span><strong id="timer">00:00</strong></div><button id="reset" class="subtle-button" aria-label="この面を最初からやり直す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>やり直す</span></button></div>
        <div class="controls">
          <div class="dpad" role="group" aria-label="移動">
            <button data-dir="0" class="up" aria-label="上に移動"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
            <button data-dir="3" class="left" aria-label="左に移動"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
            <span class="dpad-center" aria-hidden="true"><i></i></span>
            <button data-dir="1" class="right" aria-label="右に移動"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
            <button data-dir="2" class="down" aria-label="下に移動"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
          </div>
          <div class="utility"><button id="undo" class="undo-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-6 6 6 6M3 11h12a6 6 0 0 1 0 12"/></svg><span>1手戻す</span><small>Z</small></button><button id="switch" class="switch-button" hidden><span class="friend-dots" aria-hidden="true">● ●</span><span>仲間を切替</span></button><span id="control-note" class="control-note">長押しで連続移動<br>盤面のスワイプでも移動</span></div>
        </div>
        <p class="tip" id="tip">扉の羽を横から押すと、くるりと回転。</p>
      </div>
    </section>
    <footer class="footer"><span class="legend"><i class="legend-you"></i>あなた<i class="legend-door"></i>回転扉<i class="legend-exit"></i>出口</span><span class="keyboard-note">方向キー / WASD で移動</span></footer>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
  </main>
  <dialog id="panel" aria-labelledby="panel-title"><div class="panel-top"><div><span class="eyebrow" id="panel-kicker"></span><h1 id="panel-title"></h1></div><button id="close-panel" class="icon-button" aria-label="閉じる">×</button></div><div id="panel-body"></div><div id="panel-actions"></div></dialog>
</body>
</html>
